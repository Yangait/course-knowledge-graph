<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <meta
        name="description"
        content="面向计算机专业课程的知识图谱增强问答系统"
    >
    <title>计算机专业知识图谱问答系统</title>
    <link rel="stylesheet" href="/static/vendor/katex/dist/katex.min.css">
    <link rel="stylesheet" href="/static/vendor/highlightjs/styles/github.min.css">
    <link rel="stylesheet" href="/static/style.css?v=20260918-1">
    <script src="/static/vendor/markdown-it/dist/browser/markdown-it.umd.min.js" defer></script>
    <script src="/static/vendor/dompurify/dist/purify.min.js" defer></script>
    <script src="/static/vendor/katex/dist/katex.min.js" defer></script>
    <script src="/static/vendor/markdown-it-texmath/texmath.js" defer></script>
    <script src="/static/vendor/highlightjs/highlight.min.js" defer></script>
    <script src="/static/answer-renderer.js" defer></script>
    <script src="/static/app.js?v=20260918-1" defer></script>
</head>
<body>
    <div class="workspace">
        <aside id="historySidebar" class="history-sidebar" aria-label="历史会话">
            <div class="history-heading">
                <span class="sidebar-brand" aria-label="知识助手"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6l-5 3v-3a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/><path d="M8 9h8M8 13h5"/></svg></span>
                <button id="sidebarClose" class="icon-button" type="button" aria-label="收起侧栏" title="收起侧栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
            </div>
            <nav class="sidebar-nav" aria-label="主要功能">
                <button id="newChatButton" class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M15 3l6 6M10 14l1-5 7-7 4 4-7 7-5 1Z"/></svg>新建聊天</button>
                <a class="nav-item" href="/graph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M9 6h6M7.5 8.5l3 7M16.5 8.5l-3 7"/></svg>知识导图</a>
                <label class="chat-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="chatSearch" type="search" placeholder="搜索聊天" aria-label="搜索聊天" autocomplete="off"></label>
            </nav>
            <p class="history-caption">聊天</p>
            <div id="conversationList" class="conversation-list" aria-live="polite"></div>
            <div class="sidebar-footer"><span class="local-avatar" aria-hidden="true">知</span><div><span class="local-label">本地会话</span><p id="historyStatus" class="history-note" role="status">正在加载会话…</p></div></div>
        </aside>
        <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="关闭历史侧栏" tabindex="-1"></button>
    <main class="app-shell is-empty">
        <header class="app-header">
            <div class="brand">
                <button id="historyToggle" class="icon-button history-toggle" type="button" aria-label="展开侧栏" title="展开侧栏" aria-controls="historySidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
                <h1 title="计算机专业知识图谱问答系统">知识助手</h1>
            </div>
            <div class="header-actions">
                <div
                    id="healthBadge"
                    class="health-badge"
                    data-state="checking"
                    role="status"
                    aria-live="polite"
                >
                    <span class="health-dot" aria-hidden="true"></span>
                    <span id="healthText">正在检查图谱</span>
                </div>
                <button id="clearButton" class="icon-button" type="button" aria-label="新建聊天" title="新建聊天"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M15 3l6 6M10 14l1-5 7-7 4 4-7 7-5 1Z"/></svg></button>
            </div>
        </header>

        <section
            id="chatMessages"
            class="chat-messages"
            role="log"
            aria-label="聊天消息"
            aria-live="polite"
        >
            <div class="welcome-state"><h2>有什么可以帮你？</h2></div>
        </section>

        <section class="question-panel" aria-label="提问区域">
            <form id="chatForm" class="composer">
                <label class="sr-only" for="questionInput">输入你的问题</label>
                <textarea
                    id="questionInput"
                    name="question"
                    rows="1"
                    maxlength="500"
                    placeholder="向知识助手提问"
                    aria-describedby="composerHint composerStatus"
                ></textarea>
                <div class="composer-tools">
                    <div class="focus-context">
                        <span id="focusedLabel" hidden></span>
                        <button id="clearFocus" class="clear-button" type="button" hidden>取消限定</button>
                    </div>
                    <label class="answer-style" title="选择回答详略；问题中明确提出的要求优先">
                        <span class="sr-only">回答方式</span>
                        <select id="answerStyle" aria-label="回答方式">
                            <option value="auto">自动</option>
                            <option value="concise">简洁</option>
                            <option value="detailed">详细</option>
                        </select>
                    </label>
                    <button id="sendButton" class="send-button" type="submit" aria-label="发送" title="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
                </div>
            </form>

            <div class="composer-footer">
                <span id="composerHint">回答可能存在错误，请核实重要信息。</span>
                <span id="composerStatus" role="status" aria-live="polite">
                    Enter 发送 · Shift+Enter 换行
                </span>
            </div>
        </section>
    </main>
    </div>
    <dialog id="conversationDialog" aria-labelledby="dialogTitle">
        <form id="conversationDialogForm">
            <h2 id="dialogTitle">重命名会话</h2>
            <p id="dialogDescription"></p>
            <label id="dialogNameLabel" for="dialogName">会话名称</label>
            <input id="dialogName" type="text" maxlength="80" autocomplete="off">
            <p id="dialogError" role="alert"></p>
            <div class="dialog-actions">
                <button id="dialogCancel" class="clear-button" type="button">取消</button>
                <button id="dialogSubmit" class="send-button" type="submit">保存</button>
            </div>
        </form>
    </dialog>
</body>
</html>
